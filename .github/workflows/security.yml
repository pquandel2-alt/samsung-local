name: Dependency security

on:
  push:
    branches: [main, develop]
    paths:
      - pyproject.toml
      - custom_components/samsung_local/manifest.json
      - .github/workflows/security.yml
  pull_request:
    paths:
      - pyproject.toml
      - custom_components/samsung_local/manifest.json
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime dependency set
        run: python -m pip install --upgrade pip pip-audit && python -m pip install '.[test]'
      - name: Audit installed environment
        run: python -m pip_audit --local
