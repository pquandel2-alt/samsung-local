name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test,dev,homeassistant-test]'
      - name: Ruff
        run: ruff check custom_components tests && ruff format --check custom_components tests
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Type check
        run: mypy custom_components/samsung_local
      - name: Unit tests
        run: pytest -q --cov=custom_components.samsung_local --cov-report=term-missing --cov-report=xml

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Home Assistant test harness
        run: python -m pip install --upgrade pip && python -m pip install '.[test,homeassistant-test]'
      - name: Home Assistant integration tests
        run: pytest -q -m homeassistant

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
